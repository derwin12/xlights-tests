name: Render scenarios

on:
  schedule:
    # 08:00 UTC, the middle of the night in the US
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      xlights_repo:
        description: xLights repository to test
        default: xLightsSequencer/xLights
      xlights_ref:
        description: xLights branch, tag or commit to test
        default: master
      filter:
        description: Only scenarios whose name contains this (empty = all)
        default: ""
      rebaseline:
        description: Commit this run's renders as the new baselines
        type: boolean
        default: false
      publish:
        description: Add this run to the dashboard on GitHub Pages
        type: boolean
        default: false
      coverage:
        description: Also measure line coverage with a gcov build (the nightly run always does)
        type: boolean
        default: false
  # A pull request to this repo runs the scenarios against xLights master, so a
  # new or changed scenario is checked before it lands.
  pull_request:

concurrency:
  group: render-${{ github.event.pull_request.number || github.ref }}-${{ github.event.inputs.xlights_ref || 'master' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XL_REPO: ${{ github.event.inputs.xlights_repo || 'xLightsSequencer/xLights' }}
  XL_REF: ${{ github.event.inputs.xlights_ref || 'master' }}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ghcr.io/xlightssequencer/xlights-build-docker:master
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout xlights-tests
        uses: actions/checkout@v6

      - name: Checkout xLights
        uses: actions/checkout@v6
        with:
          repository: ${{ env.XL_REPO }}
          ref: ${{ env.XL_REF }}
          path: xlights
          submodules: "true"
          # Full history without blobs: enough for `git describe` to name the
          # version, without downloading every file ever committed.
          fetch-depth: 0
          filter: blob:none

      - name: Install the test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth python3
          git config --global --add safe.directory '*'

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-render-${{ github.run_id }}
          restore-keys: ccache-render-

      - name: Build xLights
        working-directory: xlights
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
          PATH=/usr/lib/ccache:$PATH make -j $(nproc)
          ccache --show-stats

      - name: Run the scenarios
        id: run
        run: |
          export XL_SHA=$(git -C xlights rev-parse HEAD)
          export XL_VERSION=$(git -C xlights describe --tags --match='[0-9]*' 2>/dev/null || git -C xlights rev-parse --short HEAD)
          # The wx app initialises GTK even for --headless and --fseqcmp.
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          export DISPLAY=:99
          python3 scripts/run_scenarios.py --xlights xlights/bin/xLights --show show \
            --baselines baselines --out artifacts -k "${{ github.event.inputs.filter }}"

      - name: Summarize
        if: always()
        run: python3 scripts/ci_summary.py artifacts/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: |
            artifacts/results.json
            artifacts/junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renders
          path: artifacts/fseq/
          if-no-files-found: ignore
          retention-days: 14

  # The same scenarios on a gcov-instrumented build, to measure which xLights
  # code they reach. Only the xLights sources get --coverage: the prerequisites
  # (wxWidgets, ISPC, ...) are built first without it, then just the xLights
  # objects with the compiler and linker overridden.
  coverage:
    if: github.event_name == 'schedule' || github.event.inputs.coverage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/xlightssequencer/xlights-build-docker:master
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout xlights-tests
        uses: actions/checkout@v6

      - name: Checkout xLights
        uses: actions/checkout@v6
        with:
          repository: ${{ env.XL_REPO }}
          ref: ${{ env.XL_REF }}
          path: xlights
          submodules: "true"
          fetch-depth: 0
          filter: blob:none

      - name: Install the test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth python3 python3-pip
          pip3 install gcovr || pip3 install --break-system-packages gcovr
          git config --global --add safe.directory '*'

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-coverage-${{ github.run_id }}
          restore-keys: ccache-coverage-

      - name: Build xLights with coverage
        working-directory: xlights
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          export PATH=/usr/lib/ccache:$PATH
          make wxwidgets33 cbp2make linkliquid ispc klightmapper makefile vulkanshaders
          make -j $(nproc) subdirs CXX="g++ --coverage" CC="gcc --coverage" LD="g++ --coverage"
          ccache --show-stats

      - name: Run the scenarios
        # Pass/fail is the render job's business; this run only feeds gcov.
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          export DISPLAY=:99
          python3 scripts/run_scenarios.py --xlights xlights/bin/xLights --show show \
            --baselines baselines --out artifacts -k "${{ github.event.inputs.filter }}" || true

      - name: Measure coverage
        # The makefile compiles from xlights/xLights with ../src-core/... paths,
        # so gcov has to run from there for the sources to resolve.
        working-directory: xlights/xLights
        run: |
          echo "gcda files: $(find . -name '*.gcda' | wc -l)"
          mkdir -p ../../coverage
          core=$(realpath ../src-core)
          ui=$(realpath ../src-ui-wx)
          gcovr --root .. --object-directory . -j $(nproc)             --filter "$core/" --filter "$ui/"             --gcov-ignore-parse-errors=all             --json-summary ../../coverage/gcovr-summary.json             --html-details ../../coverage/index.html --html-title "xLights render-test coverage"
          python3 -c "import json; f=json.load(open('../../coverage/gcovr-summary.json'))['files']; print(len(f), 'files, e.g.', [x['filename'] for x in f[:3]])"
          python3 ../../scripts/coverage_summary.py ../../coverage/gcovr-summary.json ../../coverage/coverage.json
          du -sh ../../coverage

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  # Commits the first render of every scenario as its baseline. Run it by hand
  # after a change that is meant to alter rendering, or after adding scenarios.
  rebaseline:
    needs: render
    if: always() && !cancelled() && github.event.inputs.rebaseline == 'true' && needs.render.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout xlights-tests
        uses: actions/checkout@v6

      - name: Download the renders
        uses: actions/download-artifact@v8
        with:
          name: renders
          path: baselines

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          name: results
          path: results

      - name: Commit the baselines
        run: |
          version=$(python3 -c "import json;d=json.load(open('results/results.json'));print(d['version'] or d['sha'][:9])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baselines
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Rebaseline against xLights $version" -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          fi

  # The dashboard on GitHub Pages. history.json is carried over from the live
  # site on every deploy, because each deploy replaces the whole site.
  publish:
    needs: [render, coverage]
    if: always() && !cancelled() && needs.render.result != 'skipped' && (github.event_name == 'schedule' || github.event.inputs.publish == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout xlights-tests
        uses: actions/checkout@v6

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          name: results
          path: results

      - name: Download the coverage report
        if: needs.coverage.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: site/coverage

      - name: Build the dashboard
        run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" \
            -o history.json || echo "no published history yet"
          python3 scripts/build_site.py results/results.json site history.json \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
